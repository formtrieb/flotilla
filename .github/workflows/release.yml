# Release — publish the engine to the public npm registry via npm trusted publishing.
#
# TWO STRINGS ARE MATCHED LITERALLY BY THE REGISTRY, and neither is validated when
# the trusted publisher is saved — a mismatch surfaces only when a real release is
# already halfway out the door:
#
#   1. THE FILENAME OF THIS WORKFLOW.  The trusted publisher on npmjs.com must be
#      configured with the exact string
#
#          release.yml
#
#      Renaming or moving this file silently breaks publishing until the registry
#      side is edited to match. If you rename it, edit the trusted publisher first.
#
#   2. THE REPOSITORY URL IN THE PACKAGE MANIFEST.  `repository.url` in
#      tools/wave/package.json is `git+https://github.com/formtrieb/flotilla.git`.
#      Provenance is refused if the manifest does not point at the repository this
#      workflow runs in, so that field and this repository must stay in step.
#
# THERE IS NO REGISTRY CREDENTIAL IN THIS FILE — not as a secret, not as an env var,
# not as a fallback, and not behind a condition. The registry mints a short-lived
# credential for this workflow through the OIDC exchange that `id-token: write`
# enables below. A token path added "just in case" would defeat the entire reason
# this workflow exists, and would outlive the reason it was added. Don't.
#
# Configuring the trusted publisher on the registry is a human action in an account
# this repository cannot reach; cutting a release is a separate act. This workflow is
# only the steady-state automation for every release after the first.
name: Release

on:
  # DELIBERATE TRIGGERS ONLY. A publish is irreversible — a version number can never
  # be reused — so there is intentionally NO `push:` trigger of any kind, and in
  # particular none on the default branch: merging a PR to `main` must never cut a
  # release. Both routes below require an explicit human act.
  release:
    types: [published] # normal route: a human publishes a GitHub Release
  workflow_dispatch: # manual route: re-run after a transient registry failure

permissions:
  contents: read # checkout only
  id-token: write # REQUIRED — without it the OIDC exchange cannot happen at all

jobs:
  publish:
    name: Publish engine (npm trusted publishing)
    runs-on: ubuntu-latest
    defaults:
      run:
        # The package does not live at the repository root. Every step below — the
        # two gates and the publish itself — runs from the package directory.
        working-directory: tools/wave
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Same Node line the verify workflow pins, so the gates re-run below on the
          # toolchain they gate against.
          node-version: "22"

          # WHY `registry-url` IS SET even though this workflow holds no token: the
          # registry's own documented workflow example for trusted publishing sets it to
          # the public registry AND sets no auth environment variable on the publish
          # step — exactly the combination that looks broken from the outside, because
          # the action writes an .npmrc auth stanza referencing a token that will never
          # exist here. The vendor publishes that as the working configuration. Nobody
          # can execute this path before the first real release, so the vendor's
          # documented example is the strongest evidence available, and departing from
          # it is the risky direction rather than the cautious one. Do not delete this
          # on the reasoning that an unused auth stanza must be harmful.
          #
          # That example is now published formally, and this step is pinned to the
          # action major it pins: actions/setup-node, docs/advanced-usage.md,
          # "Publishing to npm with Trusted Publisher (OIDC)". Read it before changing
          # anything in this block.
          registry-url: "https://registry.npmjs.org"

          # DEPENDENCY CACHING IS DELIBERATELY OFF — do not switch it on for speed.
          # This input is the vendor's own instruction for a trusted-publishing job,
          # and the ground it gives is a supply-chain property rather than a
          # performance preference. Two distinct costs, both paid by this job alone:
          # a poisoned cache can expose credentials — including the OIDC token this
          # workflow's entire security model rests on — to attacker-controlled code;
          # and it can put dependency content into the published artifact that differs
          # from what a clean `npm ci` resolves, which is precisely what provenance on
          # this package claims. A release job runs rarely; the seconds a cache saves
          # are worth nothing against either. (The verify workflow does cache — it runs
          # on every push and publishes nothing, so neither cost applies to it.)
          #
          # WHY THIS IS STATED RATHER THAN LEFT TO THE DEFAULT: from setup-node v5 on,
          # npm caching switches itself ON whenever package.json names npm through
          # `packageManager` or `devEngines.packageManager`. tools/wave/package.json
          # names neither today, so silence would happen to be correct — right up until
          # someone adds that field for an unrelated reason and silently turns caching
          # on in the release build. Saying it holds either way.
          package-manager-cache: false

      - name: Install an npm new enough for trusted publishing
        # THE TRAP THIS STEP EXISTS FOR — do not "simplify" it away.
        # Trusted publishing requires npm >= 11.5.1. The Node line pinned above
        # bundles npm 10.9.8, which is BELOW that floor. A release workflow that
        # inherits whatever npm the Node line happens to ship looks correct, passes
        # review, and then fails at the publish step of a real release — the worst
        # possible moment to find out. The floor is therefore stated explicitly here
        # rather than implied by the Node version.
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: "Engine gate: tests (vitest)"
        run: npm test

      - name: "Engine gate: typecheck (tsc)"
        # Both gates run before the publish step, in this job, so a red suite or a
        # type error stops the release instead of shipping.
        run: npm run typecheck

      - name: Publish to npm
        # No auth flags and no environment. `--provenance` is deliberately absent: for a
        # public repository publishing a public package the registry attaches
        # provenance by itself. No token is read here — npm performs the OIDC
        # exchange on its own using the identity token permission granted above.
        #
        # The MISSING auth environment variable is the other half of the `registry-url`
        # note above, and is just as deliberate: the vendor's documented example sets
        # the registry URL and gives the publish step no `NODE_AUTH_TOKEN`. Adding one
        # here would be the token path this whole workflow exists to avoid.
        #
        # `--tag` IS required for a prerelease version — npm (>= the 11.x line this job
        # floats onto via the install step above) refuses `npm publish` of a version
        # with a prerelease suffix unless an explicit dist-tag is given, so a
        # prerelease can never ACCIDENTALLY shadow `latest`. Live occurrence: the
        # v0.1.0-beta.1 release run failed exactly here ("You must specify a tag using
        # --tag when publishing a prerelease version") although v0.1.0-beta.0 had
        # published clean three days earlier — the floor-without-ceiling npm install
        # floats forward, and the requirement arrived with it.
        #
        # THE EXPLICIT TAG IS `latest` ON PURPOSE — the pre-1.0 posture, decided by the
        # operator (2026-07-30): every release of this package so far IS a beta, and
        # the documented npm-first invocation form is the BARE `npx
        # @formtrieb/flotilla-engine`, which installs `latest`. A prerelease parked on
        # a side tag leaves `latest` pointing at an older beta, and the documented
        # form silently resolves stale — exactly what happened when v0.1.0-beta.1
        # first published under `--tag beta` and the bare form kept installing
        # beta.0 (fixed by a manual `npm dist-tag add`). The accidental-shadowing
        # concern the npm guard protects against does not apply while no stable line
        # exists. REVISIT AT THE FIRST STABLE RELEASE: once a stable is out, a
        # continuing beta line moves to `--tag beta` and this comment moves with it.
        # A stable version publishes untagged and lands `latest`, the default.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) npm publish --tag latest ;;
            *)   npm publish ;;
          esac
