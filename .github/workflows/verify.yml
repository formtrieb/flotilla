name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  engine-tests:
    name: Engine Tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/wave
    steps:
      - name: Checkout
        # Bumped v6 -> v7 in lockstep with the release workflow's checkout pin — see
        # .github/workflows/release.yml for the release-notes check (read live against
        # the vendor's docs in this dispatch, never carried from memory). Bump both
        # workflows' checkout pins together.
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        # Kept in lockstep with the release workflow's actions/setup-node pin — see
        # .github/workflows/release.yml for the vendor-conformance note (checked live
        # against the vendor's docs, never carried from memory). Bump both together.
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/wave/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  engine-typecheck:
    name: Engine Typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/wave
    steps:
      - name: Checkout
        # Bumped v6 -> v7 in lockstep with the release workflow's checkout pin — see
        # .github/workflows/release.yml for the release-notes check (read live against
        # the vendor's docs in this dispatch, never carried from memory). Bump both
        # workflows' checkout pins together.
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        # Kept in lockstep with the release workflow's actions/setup-node pin — see
        # .github/workflows/release.yml for the vendor-conformance note (checked live
        # against the vendor's docs, never carried from memory). Bump both together.
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/wave/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck
